# Builds the Windows installer and the Mac disk image - when a version tag (v1.2.3) is pushed, or by hand with
# "Run workflow" on the Actions tab - and attaches them to a DRAFT GitHub Release together with SHA-256 checksums and a
# list of every bundled library (SBOM). Nothing is published until you press "Publish". The version always comes from
# src/vaelon/__init__.py.
# Signatures are NOT made here: the release key stays offline on the owner's computer. Before pressing Publish run
#   python scripts/release_sign.py sign-draft X.Y.Z --key <key file>   (docs/PUBLISHING.md, section 7b)
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
# least privilege: the build jobs can only read; only the last job may create the (draft) release.
# Every `uses:` is pinned to a full commit SHA (the tag in a comment): a moved tag cannot change what runs.
# Dependabot (.github/dependabot.yml) proposes updates as pull requests.
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.13" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: "22" }
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/vaelon/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          pip install -e ".[system,search,docs,vision,app,live]" "piper-tts>=1.2" numpy pyinstaller cyclonedx-bom
      - name: Tests
        shell: bash
        run: |
          python scripts/check_secrets.py
          failed=""  # run every file, then list all failures at once
          for f in tests/test_*.py; do python -I "$f" || failed="$failed $f"; done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
      - name: Build the app
        run: python scripts/build_app.py
      - name: Installer (Inno Setup)
        shell: pwsh
        env: { VERSION: "${{ steps.ver.outputs.version }}" }
        run: |
          # Inno Setup 7.1.1 from its official release (Chocolatey has no 7.x package). Checked twice before it runs:
          # the SHA-256 published with that release, and a valid Authenticode signature by Pyrsys B.V. (the publisher
          # named on jrsoftware.org).
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          $sha = "8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0"
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw "Inno Setup download: wrong SHA-256" }
          $sig = Get-AuthenticodeSignature $setup
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Pyrsys") { throw "Inno Setup download: bad signature" }
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/ALLUSERS" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
          $v = $env:VERSION
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 7\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe" -EA SilentlyContinue | Select-Object -First 1
          # ISCC.exe carries no version number in its file info; the version is fixed by the checked download above
          if (-not $iscc) { throw "Inno Setup 7 not found after the install" }
          & $iscc.FullName "/DAppVersion=$v" installer\vaelon.iss
      - name: Portable zip, SBOM, checksums
        shell: pwsh
        env: { VERSION: "${{ steps.ver.outputs.version }}" }
        run: |
          $v = "v$env:VERSION"
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist\Vaelon\* -DestinationPath "release\Vaelon-$v-portable.zip"
          Copy-Item installer\Output\*.exe release\
          cyclonedx-py environment --output-format JSON --output-file "release\Vaelon-$v-sbom.cdx.json"
          Copy-Item LICENSE, NOTICE, THIRD_PARTY.md release\
          Get-ChildItem release -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii release\SHA256SUMS.txt
          Get-Content release\SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: { name: windows, path: release/ }

  # the Mac version: built on GitHub's free macOS machines (Apple builds Mac apps only on a Mac). Ad-hoc signed, not
  # notarised (no paid Apple account) - users confirm it once in System Settings > Privacy & Security.
  macos:
    runs-on: macos-latest  # GitHub retires old macOS images; "latest" keeps the build working
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.13" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: "22" }
      - name: Install
        run: pip install -e ".[system,search,docs,vision,app,live,mac]" "piper-tts>=1.2" numpy pyinstaller
      - name: Tests
        run: |
          python scripts/check_secrets.py
          failed=""  # run every file, then list all failures at once
          for f in tests/test_*.py; do python -I "$f" || failed="$failed $f"; done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
      - name: Build the app and the disk image
        run: python scripts/build_mac.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: { name: macos, path: "dist/*.dmg" }

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { path: release, merge-multiple: true }
      - name: Checksums
        run: |
          cd release
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}  # the tag is made on the commit that was built, nothing else
          name: Vaelon ${{ needs.windows.outputs.version }}
          draft: true
          generate_release_notes: true
          files: release/*
