# Quick checks on Linux, Windows and macOS for every pull request and push to main (free for a public repository).
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e .
      - run: python scripts/check_secrets.py
      - run: python -I tests/test_core.py
      - run: python -I tests/test_runtime.py
      - run: python -I tests/test_structured.py
      - run: python -I tests/test_learning.py
      - run: python -I tests/test_power.py
      - run: python -I tests/test_security.py
      - run: python -I tests/test_intents.py
      - run: python -I tests/test_parallel.py
      - run: python -I tests/test_create.py
      - run: python -I tests/test_companion.py
      - run: python -I tests/test_rename.py
      - run: python -I tests/test_live.py
      - run: python -I tests/test_macos.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
        working-directory: ui/web
      - run: npx tsc --noEmit
        working-directory: ui/web
